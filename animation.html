<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Roman Programmed Me!</title>
    <style>
        body {
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            font-family: 'Courier New', monospace;
        }
        .matrix-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            animation: matrix-fall 10s linear infinite;
        }
        .matrix-char {
            position: absolute;
            color: #0f0;
            font-size: 20px;
            animation: matrix-fall 1s linear infinite;
        }
        .animated-text {
            font-size: 48px;
            color: #ff4500;
            text-shadow: 0 0 10px #ff4500, 0 0 20px #ff4500, 0 0 30px #ff4500;
            animation: pulse 2s infinite;
            position: relative;
            z-index: 10;
        }
        @keyframes matrix-fall {
            0% { transform: translateY(-100%); }
            100% { transform: translateY(100vh); }
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="matrix-bg"></div>
    <div class="animated-text">Roman Programmed Me!</div>
    <script>
        // Generate random matrix characters
        const chars = '0123456789';
        const matrixBg = document.querySelector('.matrix-bg');
        const fontSize = 20;
        const charCount = 100;
        
        for (let i = 0; i < charCount; i++) {
            const char = document.createElement('div');
            char.classList.add('matrix-char');
            char.textContent = chars[Math.floor(Math.random() * chars.length)];
            char.style.left = `${Math.random() * 100}vw`;
            char.style.top = `${-fontSize}px`;
            char.style.fontSize = `${fontSize}px`;
            matrixBg.appendChild(char);
            
            // Random animation duration
            const duration = 1 + Math.random() * 3;
            char.style.animationDuration = `${duration}s`;
            char.style.animationDelay = `${Math.random() * 5}s`;
        }
    </script>
</body>
</html>
