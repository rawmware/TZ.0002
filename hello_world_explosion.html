<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hello World Explosion</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: linear-gradient(45deg, #000000, #111111);
            font-family: Arial, sans-serif;
        }
        .grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, rgba(255, 255, 255, 0.05) 0%, rgba(255, 255, 255, 0) 70%);
            animation: grid-pulse 30s infinite linear;
        }
        @keyframes grid-pulse {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .hello {
            font-size: 4rem;
            color: #333;
            text-align: center;
            animation: fade-in 2s ease-in-out, pulse 3s infinite;
            position: relative;
            z-index: 10;
        }
        @keyframes fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        .explosion {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, red, orange, yellow);
            opacity: 0;
            animation: explode 1s ease-out forwards, fade-out 1s ease-out forwards;
        }
        @keyframes explode {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0; }
            50% { transform: translate(-50%, -50%) scale(2.5); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(5); opacity: 0; }
        }
        @keyframes fade-out {
            0% { opacity: 1; }
            100% { opacity: 0; }
        }
        /* Ensure the explosion triggers repeatedly */
        .hello {
            animation: fade-in 2s ease-in-out, pulse 3s infinite;
        }
        .explosion {
            animation: explode 1s ease-out forwards, fade-out 1s ease-out forwards;
        }
    </style>
</head>
<body>
    <div class="grid"></div>
    <div class="hello">Hello World</div>
    <div class="explosion"></div>
</body>
</html>
